<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHandler = originalFetch;
          // Protect against getter-only fetch property in iframe sandbox
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return fetchHandler; },
              set: function(fn) { if (typeof fn === 'function') { fetchHandler = fn; } },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            // Ignore if already locked
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: function() { return fetchHandler; },
                set: function(fn) { if (typeof fn === 'function') { fetchHandler = fn; } },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
        } catch (err) {
          console.warn('Fetch shim initialized with fallback', err);
        }
      })();
    </script>
    <title>Mystiq</title>
    <meta name="description" content="Mystiq — AI-powered Palmistry & Tarot Intelligence with biometric extraction, interactive spreads, and 5-factor insight synthesis." />

</html>
