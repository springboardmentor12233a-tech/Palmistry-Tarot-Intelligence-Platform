version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: palmistry_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-palmistry_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - palmistry_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: palmistry_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=${PORT:-8000}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-palmistry_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-palmistry_db}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","https://palmistry-frontend.vercel.app"]}
    volumes:
      - results_data:/app/results
      - ./assets:/app/assets
    networks:
      - palmistry_network

volumes:
  postgres_data:
  results_data:

networks:
  palmistry_network:
    driver: bridge
