[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "palmtarot"
version = "1.0.0"
description = "AI Palmistry & Tarot Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pandas",
    "numpy",
    "scikit-learn",
    "pillow",
    "opencv-python-headless",
    "mediapipe",
    "torch",
    "torchvision",
    "openai",
    "reportlab",
    "streamlit",
    "plotly",
    "python-dotenv"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=palmtarot --cov=app --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]


